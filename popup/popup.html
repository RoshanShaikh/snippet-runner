<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SnippetRunner</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- MAIN LIST VIEW -->
  <div id="view-list" class="view active">
    <header>
      <!-- Logo — hidden when search is open -->
      <div class="logo" id="header-logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">SnippetRunner</span>
      </div>
      <!-- Search input — always visible -->
      <div id="search-bar" class="search-bar">
        <input id="search-input" class="search-input" type="text" placeholder="Search" autocomplete="off" spellcheck="false"/>
      </div>
      <div class="header-right">
        <!-- Import / Export -->
        <div class="menu-container">
          <button id="btn-more" class="btn-icon" title="More actions" aria-label="More actions" aria-haspopup="menu" aria-expanded="false">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <circle cx="3" cy="8" r="1.2"/>
              <circle cx="8" cy="8" r="1.2"/>
              <circle cx="13" cy="8" r="1.2"/>
            </svg>
          </button>
          <div id="more-menu" class="dropdown-menu hidden" role="menu">
            <button id="btn-export" class="dropdown-item" role="menuitem">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 2v8M5 4l3-3 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M2 11v2a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              <span>Export Snippets</span>
            </button>
            <button id="btn-import" class="dropdown-item" role="menuitem">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 10V2M5 8l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M2 11v2a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              <span>Import Snippets</span>
            </button>
            <button id="btn-feedback" class="dropdown-item" role="menuitem">
              <svg width="15" height="15" viewBox="0 0 24 24" 
                  fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M20 2H4C2.9 2 2 2.9 2 4V18C2 19.1 2.9 20 4 20H18L22 24V4C22 2.9 21.1 2 20 2ZM18 16H6V14H18V16ZM18 13H6V11H18V13ZM18 10H6V8H18V10Z"
                />
              </svg>
              <span>Report/Feedback</span>
            </button>

            <button id="btn-repo" class="dropdown-item" role="menuitem">
              <svg width="15" height="15" viewBox="0 0 24 24" 
                  fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M12 2C6.48 2 2 6.48 2 12C2 16.42 4.87 20.17 8.84 21.49C9.34 21.58 9.5 21.27 9.5 21C9.5 20.77 9.49 20.14 9.49 19.31C6.73 19.91 6.14 17.98 6.14 17.98C5.68 16.82 5.03 16.5 5.03 16.5C4.12 15.88 5.1 15.89 5.1 15.89C6.1 15.96 6.63 16.92 6.63 16.92C7.52 18.45 8.97 18.01 9.54 17.76C9.63 17.12 9.89 16.68 10.17 16.43C7.97 16.18 5.66 15.33 5.66 11.29C5.66 10.14 6.07 9.2 6.75 8.47C6.64 8.22 6.27 7.15 6.86 5.7C6.86 5.7 7.74 5.42 9.5 6.61C10.32 6.38 11.16 6.26 12 6.26C12.84 6.26 13.68 6.38 14.5 6.61C16.26 5.42 17.14 5.7 17.14 5.7C17.73 7.15 17.36 8.22 17.25 8.47C17.93 9.2 18.34 10.14 18.34 11.29C18.34 15.34 16.03 16.17 13.83 16.42C14.19 16.73 14.51 17.35 14.51 18.3C14.51 19.67 14.5 20.77 14.5 21C14.5 21.27 14.66 21.58 15.16 21.49C19.13 20.17 22 16.42 22 12C22 6.48 17.52 2 12 2Z"
                />
              </svg>
              <span>View Source</span>
            </button>
          </div>
        </div>
        <!-- History: recent results -->
        <button id="btn-history" class="btn-icon" title="History">
          <svg width="16" height="16" viewBox="2 3 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 7.5v5l4 1M4.252 5v4H8M5.07 8a8 8 0 1 1-.818 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </button>
        <!-- New snippet -->
        <button id="btn-new" class="btn-icon btn-icon--accent" title="New Snippet">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>
    <!-- hidden file input for import -->
    <input type="file" id="import-file-input" accept=".json" style="display:none"/>

    <div id="snippet-list-empty" class="empty-state hidden">
      <div class="empty-icon">📭</div>
      <p>No snippets yet.<br/>Hit <strong>＋</strong> to create one.</p>
    </div>

    <ul id="snippet-list"></ul>

  <!-- EXPORT MODAL -->
  <div id="export-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" style="flex-shrink:0">
          <path d="M8 2v8M5 4l3-3 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 11v2a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <h3>Export Snippets</h3>
      </div>
      <div class="select-all-row">
        <label class="select-all-label">
          <input type="checkbox" id="export-select-all" checked/>
          <span>Select all</span>
        </label>
        <span id="export-selected-count" class="selected-count"></span>
      </div>
      <div id="export-checklist" class="snippet-checklist"></div>
      <div class="modal-actions">
        <button id="export-cancel" class="btn-ghost">Cancel</button>
        <button id="export-confirm" class="btn-primary" style="font-size:12px;padding:5px 14px;">Download</button>
      </div>
    </div>
  </div>

  <!-- IMPORT MODAL -->
  <div id="import-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" style="flex-shrink:0">
          <path d="M8 10V2M5 8l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 11v2a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <h3>Import Snippets</h3>
      </div>
      <p class="modal-subtitle" id="import-summary">Reading file...</p>
      <div id="import-options" class="import-options hidden">
        <div class="select-all-row">
          <label class="select-all-label">
            <input type="checkbox" id="import-select-all" checked/>
            <span>Select all</span>
          </label>
          <span id="import-selected-count" class="selected-count"></span>
        </div>
        <div id="import-checklist" class="snippet-checklist"></div>
      </div>
      <div class="modal-actions">
        <button id="import-cancel" class="btn-ghost">Cancel</button>
        <button id="import-confirm" class="btn-primary" style="font-size:12px;padding:5px 14px;">Import</button>
      </div>
    </div>
  </div>

  <!-- RUN MODAL -->
  <div id="run-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-icon">▶</span>
        <h3 id="modal-snippet-name"></h3>
      </div>
      <p id="modal-snippet-desc" class="modal-snippet-desc"></p>
      <p class="modal-subtitle">Fill in variables before running</p>
      <div id="modal-vars"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn-ghost">Cancel</button>
        <button id="modal-run" class="btn-run">Run</button>
      </div>
    </div>
  </div>

  <!-- MULTILINE EDITOR OVERLAY -->
  <div id="multiline-overlay" class="multiline-overlay hidden">
    <div class="multiline-box">
      <div class="multiline-header">
        <span id="multiline-label" class="multiline-label"></span>
        <span id="multiline-hint" class="multiline-hint"></span>
      </div>
      <textarea id="multiline-textarea" class="multiline-textarea" spellcheck="false" autocomplete="off"></textarea>
      <div class="multiline-actions">
        <button id="multiline-cancel" class="btn-ghost">Cancel</button>
        <button id="multiline-confirm" class="btn-primary">Apply</button>
      </div>
    </div>
  </div>

  <!-- LOADING OVERLAY -->
  <div id="loading-overlay" class="loading-overlay hidden">
    <div class="loading-box">
      <div class="loading-spinner"></div>
      <div class="loading-text">Running<span class="loading-dots"></span></div>
    </div>
  </div>

  </div><!-- end #view-list -->

  <script src="../shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
